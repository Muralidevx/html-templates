<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cheetah — Active Referral Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; text-align: center; }
  .subtitle { font-size: 13px; color: #777; margin-bottom: 24px; text-align: center; }
  .tabs { display: flex; margin-bottom: 24px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
  .tab-btn { padding: 10px 32px; border: none; background: #fff; color: #555; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
  .tab-btn.active { background: #2563eb; color: #fff; }
  .tab-btn:hover:not(.active) { background: #f0f0f0; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 24px; width: 100%; max-width: 720px; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .flow-svg { width: 100%; }
</style>
</head>
<body>

<h1>Active Referral Suppression Gate</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="show('before', this)">Before</button>
  <button class="tab-btn" onclick="show('after', this)">After</button>
</div>

<div class="card">

  <!-- BEFORE -->
  <div id="before">
    <svg class="flow-svg" viewBox="0 0 680 540">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <text font-size="12" x="340" y="20" text-anchor="middle" fill="#888">Original flow — before</text>

      <!-- Appointment pull -->
      <rect x="240" y="34" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Appointment pull</text>
      <line x1="340" y1="78" x2="340" y2="112" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

      <!-- Eligibility check -->
      <rect x="220" y="112" width="240" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="134" text-anchor="middle" dominant-baseline="central" fill="#0c447c">Eligibility check</text>

      <!-- Not eligible exit -->
      <line x1="220" y1="134" x2="106" y2="134" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="4" y="110" width="102" height="48" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text font-size="12" x="55" y="130" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Not eligible</text>
      <text font-size="12" x="55" y="148" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">— stop</text>

      <line x1="340" y1="156" x2="340" y2="192" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

      <!-- Rec run dashed container -->
      <rect x="158" y="192" width="364" height="176" rx="10" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3"/>
      <text font-size="11" x="174" y="210" fill="#aaa">Recommendation run</text>

      <!-- Rec run box -->
      <rect x="200" y="216" width="280" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="236" text-anchor="middle" dominant-baseline="central" fill="#085041">Recommendation run</text>
      <text font-size="12" x="340" y="256" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">LLM extraction</text>

      <!-- Active referral buried -->
      <line x1="480" y1="244" x2="556" y2="244" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="558" y="218" width="116" height="52" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
      <text font-size="12" x="616" y="236" text-anchor="middle" dominant-baseline="central" fill="#791f1f">Active referral</text>
      <text font-size="12" x="616" y="254" text-anchor="middle" dominant-baseline="central" fill="#791f1f">— skip</text>
      <text font-size="11" x="518" y="238" text-anchor="middle" fill="#e24b4a">buried</text>

      <line x1="340" y1="272" x2="340" y2="320" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
      <rect x="220" y="320" width="240" height="34" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="0.5"/>
      <text font-size="12" x="340" y="337" text-anchor="middle" dominant-baseline="central" fill="#aaa">Pathway rule</text>

      <line x1="340" y1="354" x2="340" y2="390" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

      <!-- Recommendation generated -->
      <rect x="220" y="390" width="240" height="44" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="412" text-anchor="middle" dominant-baseline="central" fill="#27500a">Recommendation generated</text>

      <!-- Problem banner -->
      <rect x="160" y="452" width="360" height="36" rx="6" fill="#fcebeb" stroke="#f09595" stroke-width="0.5"/>
      <text font-size="12" x="340" y="470" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">Problem: referral check buried — wastes LLM calls, hard to audit</text>
    </svg>
  </div>

  <!-- AFTER -->
  <div id="after" style="display:none;">
    <svg class="flow-svg" viewBox="0 0 680 600">
      <defs>
        <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <text font-size="12" x="340" y="20" text-anchor="middle" fill="#888">New flow — after</text>

      <!-- Appointment pull -->
      <rect x="240" y="34" width="200" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Appointment pull</text>
      <line x1="340" y1="78" x2="340" y2="112" stroke="#555" stroke-width="1.2" marker-end="url(#arr2)"/>

      <!-- Eligibility check -->
      <rect x="220" y="112" width="240" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="134" text-anchor="middle" dominant-baseline="central" fill="#0c447c">Eligibility check</text>

      <!-- Not eligible exit -->
      <line x1="220" y1="134" x2="106" y2="134" stroke="#aaa" stroke-width="1" marker-end="url(#arr2)"/>
      <rect x="4" y="110" width="102" height="48" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text font-size="12" x="55" y="130" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Not eligible</text>
      <text font-size="12" x="55" y="148" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">— stop</text>

      <line x1="340" y1="156" x2="340" y2="192" stroke="#555" stroke-width="1.2" marker-end="url(#arr2)"/>

      <!-- New layer dashed container -->
      <rect x="168" y="188" width="364" height="100" rx="10" fill="none" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="6 3"/>
      <text font-size="11" x="184" y="206" fill="#854f0b">New layer</text>

      <!-- Active referral check -->
      <rect x="210" y="196" width="260" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="#633806">Active referral check</text>
      <text font-size="12" x="340" y="236" text-anchor="middle" dominant-baseline="central" fill="#854f0b">Deterministic rule via referral API</text>

      <!-- Suppressed exit -->
      <line x1="470" y1="224" x2="554" y2="224" stroke="#aaa" stroke-width="1" marker-end="url(#arr2)"/>
      <rect x="556" y="204" width="110" height="40" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
      <text font-size="11" x="611" y="224" text-anchor="middle" dominant-baseline="central" fill="#791f1f">Suppressed — stop</text>

      <line x1="340" y1="252" x2="340" y2="308" stroke="#555" stroke-width="1.2" marker-end="url(#arr2)"/>
      <text font-size="12" x="360" y="284" fill="#aaa">no referral</text>

      <!-- Rec run dashed container -->
      <rect x="168" y="308" width="364" height="110" rx="10" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3"/>
      <text font-size="11" x="184" y="326" fill="#aaa">Recommendation run</text>

      <!-- Rec run box -->
      <rect x="210" y="330" width="260" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="#085041">Recommendation run</text>
      <text font-size="12" x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">LLM extraction</text>

      <line x1="340" y1="386" x2="340" y2="422" stroke="#555" stroke-width="1.2" marker-end="url(#arr2)"/>

      <!-- Recommendation generated -->
      <rect x="220" y="422" width="240" height="44" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
      <text font-size="14" font-weight="500" x="340" y="444" text-anchor="middle" dominant-baseline="central" fill="#27500a">Recommendation generated</text>
    </svg>
  </div>

</div>

<script>
function show(tab, btn) {
  document.getElementById('before').style.display = tab === 'before' ? 'block' : 'none';
  document.getElementById('after').style.display = tab === 'after' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
